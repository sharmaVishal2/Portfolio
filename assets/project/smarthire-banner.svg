<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <rect width="800" height="420" fill="#0a1220"/>
  <!-- grid lines -->
  <line x1="0" y1="60" x2="800" y2="60" stroke="#1a2a40" stroke-width="1"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#1a2a40" stroke-width="1"/>
  <line x1="0" y1="180" x2="800" y2="180" stroke="#1a2a40" stroke-width="1"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#1a2a40" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1a2a40" stroke-width="1"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#1a2a40" stroke-width="1"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="56" height="420" fill="#0d1727"/>
  <rect x="16" y="18" width="24" height="24" rx="6" fill="url(#sbrand)"/>
  <text x="28" y="34" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">SH</text>
  <rect x="18" y="70" width="20" height="3" rx="2" fill="#67b7ff"/>
  <rect x="18" y="82" width="16" height="3" rx="2" fill="#2a3c55"/>
  <rect x="18" y="94" width="18" height="3" rx="2" fill="#2a3c55"/>
  <rect x="18" y="106" width="14" height="3" rx="2" fill="#2a3c55"/>
  <!-- topbar -->
  <rect x="56" y="0" width="744" height="44" fill="#111b2c"/>
  <text x="76" y="27" font-family="sans-serif" font-size="12" font-weight="700" fill="#e9f5ff">Interview Workspace</text>
  <!-- status pill -->
  <rect x="640" y="12" width="90" height="20" rx="10" fill="rgba(89,202,138,0.15)" stroke="rgba(120,224,165,0.3)" stroke-width="1"/>
  <circle cx="654" cy="22" r="3" fill="#7be0a5"/>
  <text x="662" y="26" font-family="monospace" font-size="8" fill="#91ebc1">Session active</text>
  <!-- resume panel -->
  <rect x="72" y="60" width="320" height="72" rx="10" fill="rgba(88,168,243,0.08)" stroke="rgba(112,201,238,0.2)" stroke-width="1"/>
  <rect x="86" y="74" width="32" height="32" rx="8" fill="rgba(116,229,232,0.13)"/>
  <text x="102" y="94" text-anchor="middle" font-family="monospace" font-size="14" fill="#86e5e6">📄</text>
  <rect x="130" y="76" width="120" height="8" rx="4" fill="#83dfe0"/>
  <rect x="130" y="90" width="180" height="6" rx="3" fill="#476180"/>
  <rect x="130" y="102" width="100" height="6" rx="3" fill="#476180"/>
  <rect x="330" y="78" width="48" height="18" rx="9" fill="rgba(89,202,138,0.15)" stroke="rgba(120,224,165,0.25)" stroke-width="1"/>
  <text x="354" y="91" text-anchor="middle" font-family="monospace" font-size="8" fill="#91ebc1">94% match</text>
  <!-- question card -->
  <rect x="72" y="148" width="320" height="110" rx="10" fill="#111d30" stroke="rgba(158,196,240,0.12)" stroke-width="1"/>
  <text x="88" y="168" font-family="monospace" font-size="8" fill="#76e0e2" letter-spacing="1">QUESTION 03</text>
  <text x="88" y="186" font-family="sans-serif" font-size="11" font-weight="600" fill="#edf6ff">How would you design a secure</text>
  <text x="88" y="200" font-family="sans-serif" font-size="11" font-weight="600" fill="#edf6ff">REST API for user profiles?</text>
  <rect x="88" y="216" width="280" height="6" rx="3" fill="#273a55"/>
  <rect x="88" y="228" width="230" height="6" rx="3" fill="#273a55"/>
  <rect x="88" y="240" width="170" height="6" rx="3" fill="#273a55"/>
  <!-- skills extracted -->
  <rect x="72" y="274" width="320" height="90" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(168,193,229,0.1)" stroke-width="1"/>
  <text x="88" y="294" font-family="monospace" font-size="8" fill="#76e0e2" letter-spacing="1">SKILLS EXTRACTED</text>
  <rect x="88" y="304" width="60" height="18" rx="9" fill="rgba(91,173,255,0.14)" stroke="rgba(91,173,255,0.25)" stroke-width="1"/>
  <text x="118" y="317" text-anchor="middle" font-family="monospace" font-size="8" fill="#a4d7ff">Spring Boot</text>
  <rect x="156" y="304" width="36" height="18" rx="9" fill="rgba(91,173,255,0.14)" stroke="rgba(91,173,255,0.25)" stroke-width="1"/>
  <text x="174" y="317" text-anchor="middle" font-family="monospace" font-size="8" fill="#a4d7ff">JWT</text>
  <rect x="200" y="304" width="52" height="18" rx="9" fill="rgba(91,173,255,0.14)" stroke="rgba(91,173,255,0.25)" stroke-width="1"/>
  <text x="226" y="317" text-anchor="middle" font-family="monospace" font-size="8" fill="#a4d7ff">PostgreSQL</text>
  <rect x="260" y="304" width="40" height="18" rx="9" fill="rgba(155,131,255,0.15)" stroke="rgba(155,131,255,0.25)" stroke-width="1"/>
  <text x="280" y="317" text-anchor="middle" font-family="monospace" font-size="8" fill="#d5cdff">React</text>
  <rect x="88" y="330" width="44" height="18" rx="9" fill="rgba(155,131,255,0.15)" stroke="rgba(155,131,255,0.25)" stroke-width="1"/>
  <text x="110" y="343" text-anchor="middle" font-family="monospace" font-size="8" fill="#d5cdff">Groq AI</text>
  <!-- right panel: AI feedback -->
  <rect x="412" y="60" width="360" height="304" rx="12" fill="#0d1828" stroke="rgba(102,197,252,0.18)" stroke-width="1"/>
  <text x="432" y="86" font-family="monospace" font-size="8" fill="#76e0e2" letter-spacing="1">AI FEEDBACK</text>
  <!-- score ring visual -->
  <circle cx="592" cy="160" r="54" stroke="#1a2a40" stroke-width="10" fill="none"/>
  <circle cx="592" cy="160" r="54" stroke="url(#scoreGrad)" stroke-width="10" fill="none" stroke-dasharray="270 339" stroke-linecap="round" transform="rotate(-90 592 160)"/>
  <text x="592" y="155" text-anchor="middle" font-family="monospace" font-size="22" font-weight="500" fill="#e9f5ff">87</text>
  <text x="592" y="172" text-anchor="middle" font-family="monospace" font-size="9" fill="#76e0e2">/ 100</text>
  <!-- feedback lines -->
  <rect x="432" y="232" width="300" height="7" rx="3" fill="#1e3050"/>
  <rect x="432" y="246" width="260" height="7" rx="3" fill="#1e3050"/>
  <rect x="432" y="260" width="220" height="7" rx="3" fill="#1e3050"/>
  <rect x="432" y="280" width="180" height="7" rx="3" fill="#1e3050"/>
  <!-- suggestion pill -->
  <rect x="432" y="304" width="200" height="22" rx="11" fill="rgba(89,202,138,0.1)" stroke="rgba(120,224,165,0.2)" stroke-width="1"/>
  <text x="532" y="319" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#91ebc1">✓ Mention rate limiting next</text>
  <!-- bottom bar -->
  <rect x="56" y="380" width="744" height="40" fill="#0d1727" stroke="#1a2a40" stroke-width="1"/>
  <rect x="76" y="392" width="100" height="16" rx="8" fill="url(#btnGrad)"/>
  <text x="126" y="404" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#07111d">Submit Answer</text>
  <rect x="188" y="392" width="80" height="16" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(168,193,229,0.15)" stroke-width="1"/>
  <text x="228" y="404" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#93a6c1">Skip</text>
  <text x="720" y="404" font-family="monospace" font-size="8" fill="#476180">3 / 8 questions</text>
  <defs>
    <linearGradient id="sbrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4aa8ff"/>
      <stop offset="100%" stop-color="#8079ee"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69b7ff"/>
      <stop offset="100%" stop-color="#78e5e8"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f9cff"/>
      <stop offset="100%" stop-color="#78e5e8"/>
    </linearGradient>
  </defs>
</svg>
