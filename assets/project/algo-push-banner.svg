      <stop offset="100%" stop-color="#0b1628"/>
    </linearGradient>
    <linearGradient id="ap-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f9cff"/>
      <stop offset="100%" stop-color="#78e5e8"/>
