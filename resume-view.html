<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vishal Sharma | Resume</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06111f;
      --text: #f4f7ff;
      --surface: rgba(8, 15, 28, 0.9);
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      text-decoration: none;
    }
    .viewer {
      width: 100%;
      height: calc(100vh - 72px);
      border: 0;
      background: white;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="index.html" class="btn">← Back to Portfolio</a>
    <a href="assets/resume/_resume_vishal.pdf" class="btn" download="Vishal-Sharma-Resume.pdf">Download Resume</a>
  </div>
  <iframe class="viewer" src="assets/resume/_resume_vishal.pdf" title="Vishal Sharma Resume"></iframe>
</body>
</html>
